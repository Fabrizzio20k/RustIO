[package]
name = "rustio"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
fastembed = "5"
futures = "0.3.31"
pnet = "0.35.0"
ratatui = "0.30.1"
rig = { package = "rig-core", version = "0.38" }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlite-vec = "0.1"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }

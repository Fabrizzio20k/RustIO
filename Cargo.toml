[package]
name = "rustio"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"
fastembed = "5"
pnet = "0.35.0"
rig-core = "0.9.0"
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlite-vec = "0.1"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
